name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The footer © year is set at build time; rebuild at 00:05 on 1 Jan Sydney (AEDT) so it rolls over without a push.
    - cron: '5 13 31 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Pinned, not ubuntu-latest: the label moves to a new Ubuntu on GitHub's schedule, and the
# build should change OS only when someone checks setup-ruby supports it. Actions are pinned
# to release commits (tag in the comment), as in link-check.yml.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # Blocks the deploy on SEO or internal-link breakage; see the top of the script.
      - name: Check the built site
        run: node script/check-site.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
